# Coolify deployment configuration for ZalSports
services:
  - name: zalsports
    image: oven/bun:1-alpine
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000
    volumes:
      - source: zalsports_data
        target: /app/data
    environment:
      DATABASE_URL: "file:/app/data/zalsports.db"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: zalsports2024
      ADMIN_SECRET: change-me-in-production
      NODE_ENV: production
